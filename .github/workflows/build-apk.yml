name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el contenido del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -o MusicPlayerApp.zip -d .

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK de debug
        working-directory: MusicPlayerApp
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: MusicPlayerApp/app/build/outputs/apk/debug/app-debug.apk
